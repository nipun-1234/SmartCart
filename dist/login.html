<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartCart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-pink: #FF473A;
            --electric-blue: #FFB800;
            --vivid-purple: #D9531E;
            --lime-green: #E8702A;
            --sunset-orange: #E8702A;
            --bright-yellow: #FFC738;
            --hot-pink: #FF1493;
            --aqua: #FFA05C;
            --coral: #FF6F61;
            --violet: #8A2BE2;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0F0C29 0%, #302B63 50%, #24243E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 500px;
            height: 500px;
            background: var(--neon-pink);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: var(--electric-blue);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        .shape-3 {
            width: 350px;
            height: 350px;
            background: var(--lime-green);
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, -100px) scale(1.1);
            }
            66% {
                transform: translate(-100px, 100px) scale(0.9);
            }
        }

        /* Particle System */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--lime-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--lime-green);
            animation: particle-float 15s infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 6s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 8s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 10s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 12s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 14s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 16s; }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* Main Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            max-height: 95vh;
            overflow-y: auto;
            animation: slideUp 0.8s ease-out;
            padding: 10px;
        }

        /* Custom Scrollbar */
        .login-container::-webkit-scrollbar {
            width: 8px;
        }

        .login-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .login-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--lime-green), var(--aqua));
            border-radius: 10px;
        }

        .login-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--aqua), var(--lime-green));
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--lime-green), var(--aqua));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px var(--lime-green);
            animation: pulse-logo 2s infinite;
        }

        @keyframes pulse-logo {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 40px var(--lime-green);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 60px var(--lime-green), 0 0 80px var(--aqua);
            }
        }

        .logo-icon i {
            font-size: 30px;
            color: #fff;
        }

        .logo-text {
            font-size: 36px;
            font-weight: 900;
        }

        .logo-main {
            background: linear-gradient(45deg, var(--bright-yellow), var(--sunset-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-accent {
            color: var(--lime-green);
            text-shadow: 0 0 20px var(--lime-green);
        }

        .welcome-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 10px;
        }

        /* Login Card */
        .login-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 40px 35px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-pink), var(--electric-blue), var(--lime-green), var(--bright-yellow));
            background-size: 400% 400%;
            border-radius: 30px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
            animation: gradient-rotate 8s ease infinite;
        }

        .login-card:hover::before {
            opacity: 0.5;
        }

        @keyframes gradient-rotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--lime-green), var(--aqua));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--lime-green);
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s;
        }

        .form-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-input:focus {
            border-color: var(--lime-green);
            box-shadow: 0 0 30px rgba(0, 255, 133, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-input:focus + .input-icon {
            color: var(--aqua);
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .password-toggle:hover {
            color: var(--lime-green);
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--lime-green);
        }

        .checkbox-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--aqua);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .forgot-link:hover {
            color: var(--lime-green);
            text-shadow: 0 0 10px var(--lime-green);
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--neon-pink), var(--vivid-purple));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 0, 128, 0.5);
            transition: all 0.3s;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-login:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(255, 0, 128, 0.7);
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        .btn-login span {
            position: relative;
            z-index: 1;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .divider-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
        }

        /* Social Login */
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 100%;
            padding: 13px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
        }

        .social-btn.google {
            border-color: #DB4437;
        }

        .social-btn.google:hover {
            border-color: #DB4437;
            box-shadow: 0 5px 20px rgba(219, 68, 55, 0.4);
        }

        .social-btn.facebook {
            border-color: #1877F2;
        }

        .social-btn.facebook:hover {
            border-color: #1877F2;
            box-shadow: 0 5px 20px rgba(24, 119, 242, 0.4);
        }

        /* Sign Up Link */
        .signup-section {
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .signup-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .signup-link {
            color: var(--lime-green);
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
            transition: all 0.3s;
        }

        .signup-link:hover {
            color: var(--aqua);
            text-shadow: 0 0 10px var(--aqua);
        }

        /* Back to Home */
        .back-home {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
            animation: fadeIn 1s ease-out;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--lime-green);
            box-shadow: 0 5px 25px rgba(0, 255, 133, 0.3);
            transform: translateX(-5px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-card {
                padding: 40px 30px;
            }

            .logo-text {
                font-size: 28px;
            }

            .card-title {
                font-size: 26px;
            }

            .back-home {
                top: 20px;
                left: 20px;
            }
        }

        /* Loading Animation */
        .loading {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .loading {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }
    
        /* ===== SMART SNEAKER SHOWCASE STYLES ===== */
        .login-layout-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1060px;
            display: flex;
            background: rgba(13, 10, 30, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), 0 0 50px rgba(0, 255, 133, 0.08);
            animation: slideUp 0.8s ease-out;
            margin: auto;
        }

        .showcase-panel {
            flex: 1.15;
            position: relative;
            background: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
            min-height: 580px;
        }

        .showcase-bg-img {
            position: absolute;
            inset: 0;
            background: url('/images/smart-rock-sneaker.jpg') center/cover no-repeat;
            transition: transform 12s cubic-bezier(0.16, 1, 0.3, 1);
            animation: subtleZoom 18s ease-in-out infinite alternate;
        }

        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .showcase-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        .showcase-header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .showcase-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 9999px;
        }

        .showcase-badge i {
            color: #ff5722;
        }

        .showcase-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* The Exact Floating Telemetry Card from Reference */
        .smart-telemetry-card {
            background: rgba(18, 14, 20, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 77, 46, 0.3);
            border-radius: 16px;
            padding: 1.4rem 1.6rem;
            max-width: 340px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 77, 46, 0.18);
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            transition: all 0.3s ease;
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .smart-telemetry-card:hover {
            border-color: rgba(255, 77, 46, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 77, 46, 0.35);
        }

        .telemetry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .telemetry-val {
            font-size: 3.5rem;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #ff4d2e;
            line-height: 1;
            font-weight: 400;
            text-shadow: 0 0 25px rgba(255, 77, 46, 0.5);
            letter-spacing: -0.02em;
        }

        .telemetry-wave-svg {
            width: 100px;
            height: 36px;
        }

        .telemetry-wave-path {
            stroke: #ff4d2e;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px rgba(255, 77, 46, 0.8));
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: wavePulse 3s linear infinite;
        }

        @keyframes wavePulse {
            0% { stroke-dashoffset: 200; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -200; }
        }

        .telemetry-header {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin-top: 0.2rem;
        }

        .telemetry-desc {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.45;
            font-family: 'Inter', sans-serif;
        }

        .form-side-panel {
            flex: 1;
            padding: 3rem 2.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            max-height: 90vh;
        }

        @media (max-width: 960px) {
            .login-layout-wrapper {
                flex-direction: column;
                max-width: 500px;
            }
            .showcase-panel {
                min-height: 280px;
                padding: 1.5rem;
            }
            .smart-telemetry-card {
                padding: 1rem 1.2rem;
                max-width: 100%;
            }
            .telemetry-val {
                font-size: 2.8rem;
            }
            .form-side-panel {
                padding: 2.2rem 1.8rem;
            }
        }

    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <!-- Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Back to Home -->
    <div class="back-home">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Home</span>
        </a>
    </div>

    <!-- Login Container -->
    
    <!-- Dual-Column Smart Showcase & Login Wrapper -->
    <div class="login-layout-wrapper">
        <!-- Left Side: Smart Sneaker & Telemetry Showcase -->
        <div class="showcase-panel">
            <div class="showcase-bg-img"></div>
            <div class="showcase-overlay"></div>

            <div class="showcase-header">
                <div class="showcase-badge">
                    <i class="fas fa-bolt"></i>
                    <span>AeroCushion Labs</span>
                </div>
                <span style="color: rgba(255,255,255,0.7); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em;">VOLCANIC ARCHITECTURE</span>
            </div>

            <div class="showcase-content">
                <!-- EXACT FLOATING TELEMETRY CARD -->
                <div class="smart-telemetry-card">
                    <div class="telemetry-row">
                        <span class="telemetry-val">78%</span>
                        <svg class="telemetry-wave-svg" viewBox="0 0 100 30">
                            <path class="telemetry-wave-path" d="M 5,15 Q 20,2 35,15 T 65,15 T 95,15" />
                        </svg>
                    </div>
                    <div class="telemetry-header">NEXT-GEN CUSHIONING ARCHITECTURE</div>
                    <div class="telemetry-desc">Impact Absorption & Energy Return Dynamics</div>
                </div>
            </div>
        </div>

        <!-- Right Side: Form Panel -->
        <div class="form-side-panel">
            <!-- Logo Section -->
            <div class="logo-section" style="margin-bottom: 20px;">
                <a href="index.html" class="logo">
                    <div class="logo-icon" style="width: 50px; height: 50px;">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <div class="logo-text">
                        <span class="logo-main" style="background: linear-gradient(45deg, var(--lime-green), var(--electric-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;">Smart</span><span class="logo-accent" style="color: #fff; font-weight: 800;">Cart</span>
                    </div>
                </a>
                <p class="welcome-text" style="font-size: 13px;">Welcome back! Sign in to continue</p>
            </div>

            <!-- Login Card -->
            <div class="login-card" style="box-shadow: none; border: none; padding: 0; background: transparent;">
            <div class="card-header">
                <h1 class="card-title">Sign In</h1>
                <p class="card-subtitle">Enter your credentials to access your account</p>
            </div>

            <form id="loginForm">
                <!-- Email Input -->
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="your.email@example.com"
                            required
                        >
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                        >
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember & Forgot -->
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember">
                        <span class="checkbox-label">Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <div class="loading"></div>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">Or continue with</span>
                <div class="divider-line"></div>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn google" id="googleLogin">
                    <i class="fab fa-google"></i>
                    <span>Continue with Google</span>
                </button>
                <button class="social-btn facebook" id="facebookLogin">
                    <i class="fab fa-facebook-f"></i>
                    <span>Continue with Facebook</span>
                </button>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-section">
                <span class="signup-text">Don't have an account?</span>
                <a href="signup.html" class="signup-link">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="/js/shared.js"></script>
    <script>
        // Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            const icon = togglePassword.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // Check for verified or reset query parameters
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('verified') === 'true') {
                showToast('Email Verified', 'Your email has been verified! You can now log in.', 'success');
            }
            if (params.get('reset_token')) {
                const token = params.get('reset_token');
                const newPass = prompt('Enter your new password (minimum 6 characters):');
                if (newPass && newPass.length >= 6) {
                    fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword: newPass })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.success) {
                            showToast('Password Reset', res.message, 'success');
                        } else {
                            showToast('Reset Failed', res.message, 'error');
                        }
                    });
                }
            }
        });

        // Form Submission
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    setAuth(data.token, data.user);
                    showToast('Welcome Back!', `Signed in as ${data.user.first_name}.`, 'success');
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/products.html';
                        }
                    }, 600);
                } else {
                    showToast('Login Failed', data.message || 'Invalid credentials.', 'error');
                }
            } catch (err) {
                showToast('Network Error', 'Could not connect to the server.', 'error');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // Forgot password flow
        document.querySelector('.forgot-link')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('Enter your registered email address to receive a password reset link:');
            if (email && email.includes('@')) {
                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email.trim() })
                    });
                    const data = await res.json();
                    showToast('Password Reset', data.message, 'info');
                } catch (_e) {
                    showToast('Error', 'Could not process password reset.', 'error');
                }
            }
        });

        // Social login demonstration
        document.getElementById('googleLogin')?.addEventListener('click', () => {
            showToast('Google OAuth', 'Redirecting to Google Secure Login in production.', 'info');
        });
        document.getElementById('facebookLogin')?.addEventListener('click', () => {
            showToast('Facebook OAuth', 'Redirecting to Facebook Secure Login in production.', 'info');
        });
    </script>
</body>
</html>
