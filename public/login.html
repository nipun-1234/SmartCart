<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SmartCart</title>
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-orange: #ff6e2b;
            --brand-flame: #ff5224;
            --brand-amber: #ffaa33;
            --brand-glow: rgba(255, 110, 43, 0.45);
            --bg-dark: #090713;
            --card-bg: #0d0b1a;
            --panel-bg: #121022;
            --input-bg: #141224;
            --border-subtle: rgba(255, 255, 255, 0.09);
            --border-hover: rgba(255, 110, 43, 0.5);
            --text-muted: rgba(255, 255, 255, 0.65);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Cosmic Flares (Matches Reference Background) */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .ambient-flare {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
        }

        .flare-1 {
            width: 520px;
            height: 520px;
            background: #8b184e;
            top: -120px;
            left: -120px;
        }

        .flare-2 {
            width: 560px;
            height: 560px;
            background: #ff551f;
            bottom: -160px;
            right: -140px;
            opacity: 0.28;
        }

        .flare-3 {
            width: 380px;
            height: 380px;
            background: #2b1f63;
            top: 40%;
            right: 25%;
            opacity: 0.3;
        }

        /* Back to Home Button */
        .back-home-btn {
            position: fixed;
            top: 24px;
            left: 28px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 20px;
            background: rgba(18, 15, 29, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .back-home-btn:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            transform: translateX(-4px);
            box-shadow: 0 10px 30px rgba(255, 110, 43, 0.25);
        }

        /* ===== MAIN CONTAINER (EXACT DUAL-COLUMN LAYOUT) ===== */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1040px;
            min-height: 620px;
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            box-shadow: 0 35px 90px -15px rgba(0, 0, 0, 0.88), 0 0 50px rgba(255, 110, 43, 0.08);
            display: grid;
            grid-template-columns: 1.08fr 1fr;
            overflow: hidden;
            animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== LEFT COLUMN: SNEAKER & TELEMETRY SHOWCASE ===== */
        .auth-visual-panel {
            position: relative;
            background-color: #06050b;
            background-image: url('/images/smart-rock-sneaker.jpg');
            background-size: cover;
            background-position: center;
            padding: 30px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 620px;
            overflow: hidden;
        }

        .auth-visual-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(8, 6, 16, 0.4) 0%, rgba(8, 6, 16, 0.05) 40%, rgba(8, 6, 16, 0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Visual Top Bar */
        .visual-top-bar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .aerocushion-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 15, 29, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 9999px;
            padding: 7px 16px;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .aerocushion-badge i {
            color: var(--brand-orange);
            font-size: 0.85rem;
            filter: drop-shadow(0 0 6px var(--brand-orange));
        }

        .volcanic-tag {
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Visual Bottom Area: EXACT Floating Telemetry Card */
        .visual-bottom-area {
            position: relative;
            z-index: 2;
        }

        .telemetry-card {
            background: rgba(14, 11, 22, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 110, 43, 0.38);
            border-radius: 18px;
            padding: 18px 22px;
            max-width: 330px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 110, 43, 0.15);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.3s ease;
            animation: floatSlow 6s ease-in-out infinite;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        .telemetry-card:hover {
            border-color: rgba(255, 110, 43, 0.65);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.8), 0 0 45px rgba(255, 110, 43, 0.3);
        }

        .telemetry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .telemetry-value {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 3.3rem;
            line-height: 1;
            font-weight: 500;
            background: linear-gradient(135deg, #ff702a 0%, #ffb13b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 110, 43, 0.45);
            letter-spacing: -0.02em;
        }

        .telemetry-wave-svg {
            width: 92px;
            height: 32px;
        }

        .telemetry-wave-path {
            stroke: var(--brand-orange);
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0 0 7px rgba(255, 110, 43, 0.85));
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: waveFlow 3.5s linear infinite;
        }

        @keyframes waveFlow {
            0% { stroke-dashoffset: 200; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -200; }
        }

        .telemetry-title {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 4px;
            line-height: 1.35;
        }

        .telemetry-subtitle {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.4;
            font-weight: 400;
        }

        /* ===== RIGHT COLUMN: SIGN IN FORM AREA ===== */
        .auth-form-panel {
            padding: 38px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #0c0a18;
            position: relative;
            overflow-y: auto;
            max-height: 90vh;
        }

        /* Top Brand Block */
        .brand-block {
            text-align: center;
            margin-bottom: 18px;
        }

        .brand-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 6px;
        }

        /* 3D Radiant Sun Sphere Icon (Matching Screenshot) */
        .brand-sphere {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe28a 0%, #ff7728 50%, #ba2800 100%);
            box-shadow: 0 0 28px rgba(255, 110, 43, 0.6), inset 0 -3px 6px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            animation: sphereGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sphereGlow {
            0% {
                box-shadow: 0 0 20px rgba(255, 110, 43, 0.45);
            }
            100% {
                box-shadow: 0 0 35px rgba(255, 110, 43, 0.75), 0 0 10px rgba(255, 180, 50, 0.5);
            }
        }

        .brand-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.95rem;
            font-weight: 800;
            color: var(--brand-orange);
            letter-spacing: -0.02em;
        }

        .brand-welcome {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.88rem;
            font-weight: 400;
        }

        /* Inner Form Card Container (Matching Screenshot) */
        .form-card-box {
            background: rgba(18, 15, 29, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 26px 28px;
            position: relative;
        }

        .form-card-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .form-card-title {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--brand-orange);
            margin-bottom: 5px;
            letter-spacing: -0.01em;
        }

        .form-card-desc {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.82rem;
            font-weight: 400;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
            width: 100%;
        }

        .input-icon-left {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-orange);
            font-size: 0.95rem;
            pointer-events: none;
            transition: transform 0.2s ease;
        }

        .form-input-field {
            width: 100%;
            height: 48px;
            background: #141324;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 0 16px 0 46px;
            color: #ffffff;
            font-size: 0.92rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input-field::placeholder {
            color: rgba(255, 255, 255, 0.32);
            font-size: 0.88rem;
        }

        .form-input-field:focus {
            border-color: var(--brand-orange);
            background: #17152a;
            box-shadow: 0 0 20px rgba(255, 110, 43, 0.22);
        }

        .form-input-field:focus + .input-icon-left {
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: var(--brand-orange);
        }

        /* Remember Me & Forgot Password Row */
        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .remember-checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            user-select: none;
        }

        .remember-checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--brand-orange);
            cursor: pointer;
            border-radius: 4px;
        }

        .forgot-pass-link {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--brand-orange);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .forgot-pass-link:hover {
            color: var(--brand-amber);
            text-decoration: underline;
        }

        /* Submit Button (Vibrant Flame Gradient) */
        .sign-in-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ff4924 0%, #ff6e2b 50%, #ff833b 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(255, 82, 36, 0.42);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .sign-in-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(255, 82, 36, 0.55);
            filter: brightness(1.06);
        }

        .sign-in-btn:active {
            transform: translateY(0);
        }

        .btn-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sign-in-btn.loading .btn-text {
            display: none;
        }

        .sign-in-btn.loading .btn-spinner {
            display: inline-block;
        }

        /* Divider */
        .form-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0 16px 0;
        }

        .divider-hr {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider-label {
            color: rgba(255, 255, 255, 0.48);
            font-size: 0.78rem;
            font-weight: 500;
        }

        /* Quick Demo / Social Login Options */
        .demo-shortcuts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .demo-pill-btn {
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.76rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-pill-btn:hover {
            background: rgba(255, 110, 43, 0.14);
            border-color: rgba(255, 110, 43, 0.4);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .demo-pill-btn i {
            color: var(--brand-orange);
            font-size: 0.8rem;
        }

        /* Bottom Sign Up Link */
        .signup-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.65);
        }

        .signup-anchor {
            color: var(--brand-orange);
            font-weight: 700;
            text-decoration: none;
            margin-left: 6px;
            transition: color 0.2s ease;
        }

        .signup-anchor:hover {
            color: var(--brand-amber);
            text-decoration: underline;
        }

        /* Responsive Breakpoints */
        @media (max-width: 960px) {
            .auth-container {
                grid-template-columns: 1fr;
                max-width: 480px;
                min-height: auto;
            }

            .auth-visual-panel {
                min-height: 260px;
                padding: 20px;
            }

            .telemetry-card {
                padding: 14px 16px;
                max-width: 100%;
            }

            .telemetry-value {
                font-size: 2.6rem;
            }

            .auth-form-panel {
                padding: 28px 22px;
            }

            .form-card-box {
                padding: 20px 18px;
            }

            .back-home-btn {
                top: 16px;
                left: 16px;
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Cosmic Flares -->
    <div class="ambient-bg">
        <div class="ambient-flare flare-1"></div>
        <div class="ambient-flare flare-2"></div>
        <div class="ambient-flare flare-3"></div>
    </div>

    <!-- Back to Store Link -->
    <a href="/index.html" class="back-home-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Store</span>
    </a>

    <!-- Dual-Column Luxury Card Container -->
    <div class="auth-container">

        <!-- LEFT COLUMN: Smart Sneaker Visual & Telemetry Showcase -->
        <div class="auth-visual-panel">
            <!-- Visual Top Bar -->
            <div class="visual-top-bar">
                <div class="aerocushion-badge">
                    <i class="fas fa-bolt"></i>
                    <span>AEROCUSHION LABS</span>
                </div>
                <span class="volcanic-tag">VOLCANIC ARCHITECTURE</span>
            </div>

            <!-- Visual Bottom: EXACT Floating Telemetry Card -->
            <div class="visual-bottom-area">
                <div class="telemetry-card">
                    <div class="telemetry-row">
                        <span class="telemetry-value">78%</span>
                        <svg class="telemetry-wave-svg" viewBox="0 0 92 32" fill="none">
                            <path class="telemetry-wave-path" d="M 4,16 C 18,2 32,30 48,16 C 64,2 78,30 88,16" />
                        </svg>
                    </div>
                    <div class="telemetry-title">
                        NEXT-GEN CUSHIONING<br>ARCHITECTURE
                    </div>
                    <div class="telemetry-subtitle">
                        Impact Absorption & Energy Return Dynamics
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Sign In Credentials -->
        <div class="auth-form-panel">
            <!-- Brand Header -->
            <div class="brand-block">
                <a href="/index.html" class="brand-row">
                    <div class="brand-sphere" title="SmartCart"></div>
                    <span class="brand-name">SmartCart</span>
                </a>
                <p class="brand-welcome">Welcome back! Sign in to continue</p>
            </div>

            <!-- Inner Form Card Box -->
            <div class="form-card-box">
                <div class="form-card-header">
                    <h1 class="form-card-title">Sign In</h1>
                    <p class="form-card-desc">Enter your credentials to access your account</p>
                </div>

                <form id="loginForm" autocomplete="on">
                    <!-- Email Field -->
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-wrap">
                            <input 
                                type="email" 
                                id="email" 
                                class="form-input-field" 
                                placeholder="your.email@example.com" 
                                required 
                                autocomplete="email"
                            >
                            <i class="fas fa-envelope input-icon-left"></i>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrap">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input-field" 
                                placeholder="Enter your password" 
                                required 
                                autocomplete="current-password"
                                style="padding-right: 46px;"
                            >
                            <i class="fas fa-lock input-icon-left"></i>
                            <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="meta-row">
                        <label class="remember-checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-pass-link" id="forgotPassLink">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="sign-in-btn" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <div class="btn-spinner"></div>
                    </button>
                </form>

                <!-- Divider -->
                <div class="form-divider">
                    <div class="divider-hr"></div>
                    <span class="divider-label">Or continue with</span>
                    <div class="divider-hr"></div>
                </div>

                <!-- Instant Demo Login Shortcuts -->
                <div class="demo-shortcuts">
                    <button type="button" class="demo-pill-btn" id="quickUserBtn" title="Fill Customer Demo Credentials">
                        <i class="fas fa-user"></i> Demo Customer
                    </button>
                    <button type="button" class="demo-pill-btn" id="quickAdminBtn" title="Fill Admin Demo Credentials">
                        <i class="fas fa-shield-alt"></i> Demo Admin
                    </button>
                </div>
            </div>

            <!-- Bottom Sign Up Link -->
            <div class="signup-footer">
                <span>Don't have an account?</span>
                <a href="/signup.html" class="signup-anchor">Sign Up</a>
            </div>
        </div>

    </div>

    <!-- Scripts: shared.js and login logic -->
    <script src="/js/shared.js"></script>
    <script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                const icon = togglePassword.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye', !isPassword);
                    icon.classList.toggle('fa-eye-slash', isPassword);
                }
            });
        }

        // Demo Credentials Auto-Fill
        document.getElementById('quickUserBtn')?.addEventListener('click', () => {
            document.getElementById('email').value = 'demo@smartcart.lk';
            document.getElementById('password').value = 'demo123';
            showToast('Demo Credentials', 'Customer credentials filled: demo@smartcart.lk', 'info');
        });

        document.getElementById('quickAdminBtn')?.addEventListener('click', () => {
            document.getElementById('email').value = 'admin@smartcart.lk';
            document.getElementById('password').value = 'admin123';
            showToast('Demo Credentials', 'Admin credentials filled: admin@smartcart.lk', 'info');
        });

        // Check query parameters (email verification or password reset)
        document.addEventListener('DOMContentLoaded', () => {
            const rememberedEmail = localStorage.getItem('smartcart_remember_email');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                const rem = document.getElementById('remember');
                if (rem) rem.checked = true;
            }

            const params = new URLSearchParams(window.location.search);
            if (params.get('verified') === 'true') {
                showToast('Email Verified', 'Your email has been verified! You can now log in.', 'success');
            }
            if (params.get('reset_token')) {
                const token = params.get('reset_token');
                const newPass = prompt('Enter your new password (minimum 6 characters):');
                if (newPass && newPass.length >= 6) {
                    fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword: newPass })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.success) {
                            showToast('Password Reset', res.message, 'success');
                        } else {
                            showToast('Reset Failed', res.message, 'error');
                        }
                    })
                    .catch(() => showToast('Error', 'Password reset failed.', 'error'));
                }
            }
        });

        // Login Form Submission
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember')?.checked;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    if (rememberMe) {
                        localStorage.setItem('smartcart_remember_email', email);
                    } else {
                        localStorage.removeItem('smartcart_remember_email');
                    }

                    setAuth(data.token, data.user);
                    showToast('Welcome Back!', `Signed in as ${data.user.first_name || 'User'}.`, 'success');
                    
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    }, 500);
                } else {
                    showToast('Login Failed', data.message || 'Invalid email or password.', 'error');
                }
            } catch (err) {
                showToast('Network Error', 'Could not reach the server. Please try again.', 'error');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // Forgot Password Flow
        document.getElementById('forgotPassLink')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const currentEmail = document.getElementById('email').value.trim();
            const email = prompt('Enter your registered email address to receive a password reset link:', currentEmail || '');
            if (email && email.includes('@')) {
                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email.trim() })
                    });
                    const data = await res.json();
                    showToast('Password Reset', data.message || 'Check your inbox for reset instructions.', 'info');
                } catch (_e) {
                    showToast('Error', 'Could not process password reset request.', 'error');
                }
            }
        });
    </script>
</body>
</html>
